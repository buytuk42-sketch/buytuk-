<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<title>BuyTuk — social sharing card</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card {
    position: relative; width: 1200px; height: 630px; box-sizing: border-box;
    background: #04070f; overflow: hidden;
    font-family: Inter, "DejaVu Sans", "Liberation Sans", system-ui, -apple-system, sans-serif;
    color: #f2f6ff;
  }
  .glow-a, .glow-b, .grid { position: absolute; inset: 0; }
  .glow-a { background: radial-gradient(60% 55% at 22% 18%, rgba(76,224,255,.30) 0%, rgba(4,7,15,0) 62%); }
  .glow-b { background: radial-gradient(58% 58% at 82% 82%, rgba(168,85,247,.28) 0%, rgba(4,7,15,0) 64%); }
  .grid {
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 84px 84px;
    -webkit-mask-image: radial-gradient(85% 75% at 50% 40%, #000 0%, transparent 80%);
            mask-image: radial-gradient(85% 75% at 50% 40%, #000 0%, transparent 80%);
  }
  .content { position: relative; padding: 78px 88px 0 88px; }
  .brandrow { display: flex; align-items: center; gap: 22px; }
  .wordmark { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .kicker {
    margin-top: 54px; font-size: 20px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase;
    background: linear-gradient(120deg,#4ce0ff 0%,#6f7bff 48%,#a855f7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 18px 0 0 0; font-size: 82px; line-height: 1.02; letter-spacing: -.035em; font-weight: 680; }
  .sub { margin-top: 26px; font-size: 27px; line-height: 1.45; color: #b9c4da; max-width: 900px; }
  .rule { position: absolute; left: 88px; bottom: 62px; width: 300px; height: 5px; border-radius: 3px;
          background: linear-gradient(120deg,#4ce0ff 0%,#6f7bff 48%,#a855f7 100%); }
  .foot { position: absolute; right: 88px; bottom: 60px; font-size: 21px; color: #7f8ba6; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="brandrow">
        <svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4ce0ff"/>
              <stop offset="50%" stop-color="#6f7bff"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <path d="M6 30 A14 14 0 0 1 34 30" fill="none" stroke="url(#g)" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="20" cy="30" r="3.2" fill="url(#g)"/>
        </svg>
        <span class="wordmark">BuyTuk</span>
      </div>
      <div class="kicker">Global technology flagship</div>
      <h1>We Build What<br/>Comes Next</h1>
      <p class="sub">Products · Platforms · Applied AI · Digital Experiences</p>
    </div>
    <div class="rule"></div>
    <div class="foot">buytuk.com</div>
  </div>
</body>
</html>
